<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="bg_prod_27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="packShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="280" height="280" rx="16" fill="url(#bg_prod_27)" stroke="#F57F17" stroke-width="1.5" stroke-opacity="0.25"/>
  
  <!-- Category banner top right -->
  <rect x="15" y="14" width="120" height="22" rx="11" fill="#F57F17" fill-opacity="0.12"/>
  <text x="75" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#F57F17" text-anchor="middle" letter-spacing="0.3">COOKING OILS & GHE</text>

  <!-- Pack Size Pill top right -->
  <rect x="195" y="14" width="70" height="24" rx="12" fill="#F57F17"/>
  <text x="230" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">1 Litre</text>

  <!-- Central Packaging Illustration Container -->
  <g filter="url(#packShadow)" transform="translate(140, 125)">
    <!-- Packaging Base -->
    <rect x="-55" y="-65" width="110" height="130" rx="12" fill="#FFFFFF" stroke="#F57F17" stroke-width="2.5"/>
    
    <!-- Top Packaging Seal / Cap -->
    <rect x="-40" y="-76" width="80" height="14" rx="4" fill="#F57F17"/>
    
    <!-- Decorative Brand Ribbon -->
    <rect x="-55" y="-45" width="110" height="34" fill="#F57F17"/>
    <text x="0" y="-24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Indus</text>
    
    <!-- Center Emblem -->
    <circle cx="0" cy="12" r="22" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.5"/>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#F57F17" text-anchor="middle">100%</text>

    <!-- Bottom Barcode Representation -->
    <g transform="translate(-36, 42)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#333" stroke-width="1.5"/>
      <line x1="4" y1="0" x2="4" y2="14" stroke="#333" stroke-width="2.5"/>
      <line x1="9" y1="0" x2="9" y2="14" stroke="#333" stroke-width="1"/>
      <line x1="13" y1="0" x2="13" y2="14" stroke="#333" stroke-width="2"/>
      <line x1="18" y1="0" x2="18" y2="14" stroke="#333" stroke-width="3"/>
      <line x1="24" y1="0" x2="24" y2="14" stroke="#333" stroke-width="1.5"/>
      <line x1="29" y1="0" x2="29" y2="14" stroke="#333" stroke-width="2"/>
      <line x1="35" y1="0" x2="35" y2="14" stroke="#333" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="14" stroke="#333" stroke-width="2.5"/>
      <line x1="46" y1="0" x2="46" y2="14" stroke="#333" stroke-width="1.5"/>
      <line x1="52" y1="0" x2="52" y2="14" stroke="#333" stroke-width="2.5"/>
      <line x1="58" y1="0" x2="58" y2="14" stroke="#333" stroke-width="1"/>
      <line x1="64" y1="0" x2="64" y2="14" stroke="#333" stroke-width="2"/>
      <line x1="70" y1="0" x2="70" y2="14" stroke="#333" stroke-width="3"/>
    </g>
  </g>

  <!-- Product Title at Bottom -->
  <text x="140" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#212529" text-anchor="middle">Indus Gold Canola Cooking Oil ...</text>
  <text x="140" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#F57F17" text-anchor="middle">Indus Dairy & Oils</text>
</svg>