[package]
name = "hbos-pos"
version = "1.0.0"
description = "Hyperlocal Business Operating System (HBOS) - POS & Retail Desktop App"
authors = ["SkyraSoft Engineering"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "shell-open"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
