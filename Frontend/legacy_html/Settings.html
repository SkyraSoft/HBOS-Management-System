<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBOS - Settings</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary: #2448b8;
            --primary-light: #e5edff;
            --border: #d9deea;
            --text: #1f2430;
            --muted: #697386;
            --bg: #f8f9fc;
            --white: #ffffff;
            --success: #0b8f5a;
            --success-bg: #e5f8ef;
            --warning: #d98200;
            --warning-bg: #fff4df;
            --danger: #c92a2a;
            --danger-bg: #ffe8e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .brand {
            height: 105px;
            padding: 25px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 700;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 700;
            line-height: 1;
        }

        .brand-subtitle {
            display: block;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .4px;
            margin-top: 5px;
        }

        .sidebar-content {
            flex: 1;
            padding: 28px 16px 18px;
            overflow-y: auto;
        }

        .sidebar-label {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: #9aa3b2;
            letter-spacing: 1px;
            padding: 0 14px 12px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-link {
            width: 100%;
            border: 0;
            background: transparent;
            color: #505867;
            text-decoration: none;
            padding: 13px 14px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: 13px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: .2s;
            text-align: left;
        }

        .sidebar-link i {
            width: 22px;
            font-size: 19px;
        }

        .sidebar-link:hover {
            background: #f3f5fa;
            color: var(--primary);
        }

        .sidebar-link.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding: 15px 16px 20px;
        }

        .bottom-link {
            margin-bottom: 5px;
        }

        /* =========================
           TOPBAR
        ========================= */

        .main {
            margin-left: 260px;
            min-height: 100vh;
        }

        .topbar {
            height: 74px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mobile-menu {
            display: none;
            border: 0;
            background: transparent;
            font-size: 24px;
        }

        .page-location {
            color: var(--muted);
            font-size: 14px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .top-icon {
            width: 38px;
            height: 38px;
            border: 0;
            background: transparent;
            border-radius: 50%;
            font-size: 19px;
            color: #515a6a;
        }

        .top-icon:hover {
            background: #f1f3f7;
        }

        .profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            padding: 30px;
            max-width: 1500px;
            margin: auto;
        }

        .page-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-title {
            margin: 0;
            font-size: 32px;
            font-weight: 750;
            letter-spacing: -.8px;
        }

        .page-description {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 15px;
        }

        /* =========================
           SETTINGS LAYOUT
        ========================= */

        .settings-layout {
            display: grid;
            grid-template-columns: 230px minmax(0, 1fr);
            gap: 22px;
            align-items: start;
        }

        .settings-nav {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            position: sticky;
            top: 94px;
        }

        .settings-nav-title {
            font-size: 12px;
            font-weight: 700;
            color: #8b94a4;
            text-transform: uppercase;
            letter-spacing: .8px;
            padding: 9px 11px 10px;
        }

        .settings-nav button {
            width: 100%;
            border: 0;
            background: transparent;
            padding: 11px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 11px;
            color: #535c6b;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            margin-bottom: 3px;
        }

        .settings-nav button i {
            width: 20px;
            font-size: 17px;
        }

        .settings-nav button:hover {
            background: #f3f5f9;
        }

        .settings-nav button.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        .content-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header-custom {
            padding: 20px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .card-header-custom h3 {
            font-size: 19px;
            margin: 0;
            font-weight: 700;
        }

        .card-header-custom p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .card-body-custom {
            padding: 22px;
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
        }

        .stat-value {
            font-size: 30px;
            font-weight: 750;
            margin-top: 14px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn-primary-custom {
            background: var(--primary);
            border: 1px solid var(--primary);
            color: white;
            padding: 10px 17px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-primary-custom:hover {
            background: #1d3d9f;
            color: white;
        }

        .btn-outline-custom {
            background: white;
            border: 1px solid var(--border);
            color: #3e4655;
            padding: 10px 17px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-outline-custom:hover {
            background: #f5f6f9;
        }

        /* =========================
           USERS
        ========================= */

        .search-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
            max-width: 390px;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #7d8696;
        }

        .search-box input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 14px 11px 39px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(36, 72, 184, .08);
        }

        .table-wrap {
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }

        .users-table th {
            background: #f7f8fc;
            color: #626b7b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .4px;
            padding: 13px 14px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .users-table td {
            padding: 15px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 600;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .status {
            display: inline-flex;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status.active {
            color: var(--success);
            background: var(--success-bg);
        }

        .status.pending {
            color: var(--warning);
            background: var(--warning-bg);
        }

        /* =========================
           PERMISSIONS
        ========================= */

        .permission-layout {
            display: grid;
            grid-template-columns: 1.4fr .8fr;
            gap: 20px;
        }

        .permission-item {
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .permission-title {
            font-weight: 650;
            font-size: 15px;
        }

        .permission-description {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .permission-check {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .permission-check.off {
            background: #f0f1f4;
            color: #a5abb6;
        }

        /* =========================
           SECURITY
        ========================= */

        .security-grid {
            display: grid;
            grid-template-columns: 1.5fr .8fr;
            gap: 20px;
        }

        .security-stat {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 17px;
        }

        .security-stat-title {
            color: var(--muted);
            font-size: 13px;
        }

        .security-stat-value {
            font-size: 21px;
            font-weight: 700;
            margin-top: 6px;
        }

        .protected {
            color: var(--success);
        }

        .audit-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        .audit-table th,
        .audit-table td {
            padding: 13px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 13px;
        }

        .audit-table th {
            background: #f7f8fc;
            color: #646d7d;
        }

        .event-success {
            color: var(--success);
            background: var(--success-bg);
            border-radius: 15px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 700;
        }

        .session {
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 13px;
            margin-bottom: 9px;
        }

        .session-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .session-name {
            font-weight: 700;
            font-size: 14px;
        }

        .session-info {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        /* =========================
           OFFLINE SYNC
        ========================= */

        .sync-banner {
            border: 1px solid #bfe8d3;
            background: #effbf5;
            border-radius: 11px;
            padding: 17px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .online-dot {
            width: 13px;
            height: 13px;
            background: #13a866;
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(19, 168, 102, .12);
        }

        .sync-status-title {
            font-weight: 700;
            color: #087443;
        }

        .sync-status-text {
            font-size: 12px;
            color: #5b7467;
            margin-top: 2px;
        }

        .sync-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .sync-card {
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 18px;
            background: white;
        }

        .sync-card-icon {
            font-size: 21px;
            color: var(--primary);
        }

        .sync-card-value {
            font-size: 25px;
            font-weight: 750;
            margin-top: 10px;
        }

        .sync-card-label {
            color: var(--muted);
            font-size: 12px;
        }

        .sync-history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            gap: 15px;
        }

        .sync-history-item:last-child {
            border-bottom: 0;
        }

        .sync-history-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .history-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--success-bg);
            color: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-title {
            font-weight: 650;
            font-size: 14px;
        }

        .history-time {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        /* =========================
           EMPTY / HELP
        ========================= */

        .simple-card {
            text-align: center;
            padding: 55px 25px;
        }

        .simple-card i {
            font-size: 45px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .simple-card h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .simple-card p {
            color: var(--muted);
            max-width: 500px;
            margin: 8px auto 20px;
        }

        /* =========================
           MOBILE OVERLAY
        ========================= */

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: 999;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {
            .sidebar {
                width: 235px;
            }

            .main {
                margin-left: 235px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .sync-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .permission-layout,
            .security-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 850px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform .25s ease;
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .sidebar-overlay.show {
                display: block;
            }

            .main {
                margin-left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .topbar {
                padding: 0 18px;
            }

            .page {
                padding: 20px 16px;
            }

            .settings-layout {
                grid-template-columns: 1fr;
            }

            .settings-nav {
                position: static;
                display: flex;
                overflow-x: auto;
                gap: 5px;
                padding: 8px;
            }

            .settings-nav-title {
                display: none;
            }

            .settings-nav button {
                min-width: max-content;
                margin: 0;
            }
        }

        @media (max-width: 650px) {
            .topbar {
                height: 64px;
            }

            .page-heading {
                flex-direction: column;
            }

            .page-title {
                font-size: 27px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .sync-stats {
                grid-template-columns: 1fr 1fr;
            }

            .sync-banner {
                align-items: flex-start;
                flex-direction: column;
            }

            .search-row {
                flex-direction: column;
            }

            .search-box {
                max-width: none;
            }

            .card-header-custom {
                align-items: flex-start;
                flex-direction: column;
            }

            .card-body-custom {
                padding: 16px;
            }

            .topbar-right {
                gap: 5px;
            }

            .page-location {
                display: none;
            }
        }

        @media (max-width: 420px) {
            .sync-stats {
                grid-template-columns: 1fr;
            }

            .top-icon:nth-child(1) {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
     SIDEBAR
========================================================= -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-logo">H</div>

            <div>
                <div class="brand-name">HBOS</div>
                <span class="brand-subtitle">RETAIL MANAGEMENT</span>
            </div>
        </div>

        <div class="sidebar-content">

            <div class="sidebar-label">Management</div>

            <div class="sidebar-menu">

                <!-- ONLY SETTINGS -->
                <button class="sidebar-link active" onclick="openSettings()">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </button>

            </div>

        </div>

        <!-- BOTTOM -->
        <div class="sidebar-bottom">

            <button class="sidebar-link bottom-link" onclick="showSimplePage('Help')">
                <i class="bi bi-gear-wide-connected"></i>
                <span>Help</span>
            </button>

            <button class="sidebar-link bottom-link" onclick="showSimplePage('Support')">
                <i class="bi bi-question-circle"></i>
                <span>Support</span>
            </button>

        </div>

    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>


    <!-- =========================================================
     MAIN
========================================================= -->

    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="topbar-left">

                <button class="mobile-menu" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>

                <div class="page-location">
                    Settings
                    <span class="mx-2">/</span>
                    <strong id="breadcrumb">Users</strong>
                </div>

            </div>

            <div class="topbar-right">

                <button class="top-icon">
                    <i class="bi bi-bell"></i>
                </button>

                <button class="top-icon">
                    <i class="bi bi-shop"></i>
                </button>

                <div class="profile">H</div>

            </div>

        </header>


        <!-- PAGE -->
        <section class="page">

            <div class="page-heading">

                <div>
                    <h1 class="page-title" id="pageTitle">
                        Settings
                    </h1>

                    <p class="page-description" id="pageDescription">
                        Manage users, permissions, security and synchronization.
                    </p>
                </div>

            </div>


            <!-- SETTINGS LAYOUT -->
            <div class="settings-layout">

                <!-- =============================================
                 SETTINGS INTERNAL NAV
            ============================================== -->

                <nav class="settings-nav">

                    <div class="settings-nav-title">
                        Settings
                    </div>

                    <button class="setting-tab active" data-page="users" onclick="loadPage('users')">
                        <i class="bi bi-people"></i>
                        Users
                    </button>

                    <button class="setting-tab" data-page="roles" onclick="loadPage('roles')">
                        <i class="bi bi-shield-check"></i>
                        Roles & Permissions
                    </button>

                    <button class="setting-tab" data-page="security" onclick="loadPage('security')">
                        <i class="bi bi-shield-lock"></i>
                        Security & Audit
                    </button>

                    <button class="setting-tab" data-page="sync" onclick="loadPage('sync')">
                        <i class="bi bi-cloud-arrow-up"></i>
                        Offline Sync
                    </button>

                </nav>


                <!-- =============================================
                 CONTENT
            ============================================== -->

                <div id="settingsContent"></div>

            </div>

        </section>

    </main>


    <!-- =========================================================
     JAVASCRIPT
========================================================= -->

    <script>

        /* ======================================================
           DATA
        ====================================================== */

        const users = [
            {
                initials: "JD",
                name: "Jane Doe",
                role: "Owner",

            },
            {
                initials: "MS",

            },
            {
                initials: "AJ",
                name: "Amanda Jones",
                role: "Cashier",
                email: "amanda@hbos.com",
                status: "Pending",
                lastActive: "Never"
            },
            {

        /* ======================================================
           SYNC NOW
        ====================================================== */

        function syncNow() {

            const button =
                document.getElementById("syncButton");

            const pending =
                document.getElementById("pendingChanges");

            if (!button) return;

            button.disabled = true;

            button.innerHTML = `
            <span
                class="spinner-border spinner-border-sm me-2"
            ></span>
            Syncing...
        `;


            setTimeout(() => {

                if (pending) {
                    pending.textContent = "0";
                }

                button.disabled = false;

                button.innerHTML = `
                <i class="bi bi-check-lg me-1"></i>
                Sync Complete
            `;


                setTimeout(() => {

                    button.innerHTML = `
                    <i class="bi bi-arrow-repeat me-1"></i>
                    Sync Now
                `;

                }, 1800);

            }, 2000);

        }
