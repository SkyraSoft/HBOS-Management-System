<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HBOS - Suppliers</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* =========================================================
           ROOT
        ========================================================= */

        :root {
            --primary: #2448b8;
            --primary-dark: #173b9f;

            --text: #20232c;
            --muted: #687287;

            --border: #d1d6e2;
            --border-light: #e7eaf0;

            --page-bg: #f7f8fb;
            --white: #ffffff;

            --success: #16803d;
            --success-bg: #e8f6ed;

            --danger: #c52222;
            --danger-bg: #fff0ee;

            --warning: #bd6800;
            --warning-bg: #fff8e7;

            --sidebar-width: 280px;
        }


        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            background: var(--page-bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .btn {
            box-shadow: none !important;
        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width: var(--sidebar-width);

            background: #fff;

            border-right: 1px solid var(--border);

            z-index: 1050;

            transition: transform .25s ease;

            display: flex;
            flex-direction: column;
        }


        /* BRAND */

        .brand {
            height: 75px;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 0 24px;

            border-bottom: 1px solid var(--border-light);
        }

        .brand-logo {
            width: 38px;
            height: 38px;

            border-radius: 9px;

            background: #edf2ff;

            color: var(--primary);

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 800;
            font-size: 18px;
        }

        .brand-title {
            color: #123989;

            font-size: 20px;
            font-weight: 800;

            line-height: 1;
        }

        .brand-subtitle {
            margin-top: 4px;

            color: #515a6b;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: .3px;
        }


        /* SIDEBAR NAV */

        .sidebar-nav {
            padding: 15px 8px;
        }

        .nav-link-custom {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 13px 13px;

            margin-bottom: 3px;

            border: 0;
            border-radius: 8px;

            background: transparent;

            color: #53627c;

            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            transition: .2s ease;
        }

        .nav-link-custom i {
            width: 21px;

            font-size: 18px;
        }

        .nav-link-custom:hover {
            background: #f0f3fa;

            color: var(--primary);
        }

        .nav-link-custom.active {
            position: relative;

            background: #e8edfc;

            color: #0d3e9f;

            font-weight: 700;
        }

        .nav-link-custom.active::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            border-radius: 0 5px 5px 0;

            background: var(--primary);
        }


        /* SIDEBAR FOOTER */

        .sidebar-footer {
            margin-top: auto;

            padding: 10px 8px 15px;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            min-height: 100vh;

            margin-left: var(--sidebar-width);
        }


        /* =========================================================
           TOPBAR
        ========================================================= */

        .topbar {
            height: 65px;

            background: #fff;

            border-bottom: 1px solid var(--border);

            position: sticky;
            top: 0;

            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;
        }

        .topbar-left {
            display: flex;
            align-items: center;

            gap: 14px;

            flex: 1;
        }

        .mobile-menu {
            display: none;

            width: 40px;
            height: 40px;

            border: 0;

            background: transparent;

            color: #303744;

            font-size: 23px;
        }


        /* SEARCH */

        .search-box {
            width: min(450px, 100%);

            height: 42px;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 0 13px;

            border-radius: 9px;

            background: #f5f3fb;

            color: #4e5564;
        }

        .search-box i {
            font-size: 18px;
        }

        .search-box input {
            width: 100%;

            border: 0;
            outline: 0;

            background: transparent;

            color: var(--text);

            font-size: 15px;
        }


        /* TOP ACTIONS */

        .top-actions {
            display: flex;
            align-items: center;

            gap: 12px;
        }

        .top-icon {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            background: transparent;

            color: #454c59;

            font-size: 18px;
        }

        .top-btn {
            height: 40px;

            padding: 0 14px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: 600;
        }

        .top-btn-outline {
            background: #fff;

            border: 1px solid #c9cfdb;

            color: #282d37;
        }

        .top-btn-primary {
            background: var(--primary);

            border: 1px solid var(--primary);

            color: #fff;
        }

        .top-btn-primary:hover {
            background: var(--primary-dark);
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            padding: 0 25px 45px;
        }


        /* BREADCRUMB */

        .breadcrumb-area {
            padding-top: 8px;

            height: 36px;

            display: flex;
            align-items: center;

            gap: 8px;

            color: #586173;

            font-size: 12px;
        }

        .breadcrumb-area .current {
            color: #222631;

            font-weight: 600;
        }


        /* PAGE HEADER */

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 22px;
        }

        .page-title {
            margin: 0;

            font-size: 32px;
            font-weight: 750;

            letter-spacing: -.8px;
        }

        .page-subtitle {
            margin-top: 6px;

            color: var(--muted);

            font-size: 13px;
        }

        .header-buttons {
            display: flex;
            gap: 9px;
        }


        /* =========================================================
           SUPPLIER LIST
        ========================================================= */

        .supplier-list-card {
            background: #fff;

            border: 1px solid var(--border);

            border-radius: 9px;

            overflow: hidden;
        }

        .list-toolbar {
            min-height: 70px;

            padding: 15px 18px;

            border-bottom: 1px solid var(--border-light);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .list-search {
            width: min(360px, 100%);

            height: 40px;

            display: flex;
            align-items: center;

            gap: 9px;

            padding: 0 12px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: #fff;
        }

        .list-search input {
            width: 100%;

            border: 0;
            outline: 0;

            font-size: 14px;
        }

        .supplier-table {
            width: 100%;

            margin: 0;

            vertical-align: middle;
        }

        .supplier-table th {
            padding: 14px 18px;

            background: #fafbfc;

            color: #596171;

            border-bottom: 1px solid var(--border);

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .35px;
        }

        .supplier-table td {
            padding: 17px 18px;

            border-bottom: 1px solid var(--border-light);

            color: #30343e;

            font-size: 14px;
        }

        .supplier-table tbody tr {
            transition: background .2s ease;
        }

        .supplier-table tbody tr:hover {
            background: #f8faff;
        }

        .supplier-name-cell {
            display: flex;
            align-items: center;

            gap: 11px;
        }

        .supplier-avatar {
            width: 38px;
            height: 38px;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #edf2ff;

            color: var(--primary);

            font-weight: 800;
        }

        .supplier-main-name {
            font-weight: 700;
        }

        .supplier-id {
            margin-top: 2px;

            color: var(--muted);

            font-size: 11px;
        }

        .badge-active {
            display: inline-flex;
            align-items: center;

            padding: 5px 9px;

            border-radius: 5px;

            background: var(--success-bg);

            color: var(--success);

            font-size: 11px;
            font-weight: 700;
        }

        .amount {
            font-weight: 700;
        }

        .amount-danger {
            color: var(--danger);
        }

        .view-btn {
            padding: 7px 11px;

            border: 1px solid #c7cedb;

            border-radius: 7px;

            background: #fff;

            color: var(--primary);

            font-size: 12px;
            font-weight: 700;
        }

        .view-btn:hover {
            background: #f1f4ff;
        }


        /* =========================================================
           PROFILE PAGE
        ========================================================= */

        .profile-layout {
            display: grid;

            grid-template-columns: 312px minmax(0, 1fr);

            gap: 24px;
        }

        .profile-card {
            background: #fff;

            border: 1px solid var(--border);

            border-radius: 9px;

            padding: 25px 23px;
        }

        .profile-title-row {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .supplier-large-icon {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--primary);

            font-size: 25px;
        }

        .profile-name {
            font-size: 19px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-flex;

            margin-top: 5px;
            margin-left: 44px;

            padding: 5px 9px;

            border-radius: 4px;

            background: var(--success-bg);

            color: var(--success);

            font-size: 11px;
            font-weight: 700;
        }

        .profile-info {
            margin-top: 26px;
        }

        .profile-field {
            margin-bottom: 17px;
        }

        .field-label {
            margin-bottom: 5px;

            color: #525a6a;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: .4px;

            text-transform: uppercase;
        }

        .field-value {
            color: #30343d;

            font-size: 15px;

            line-height: 1.5;
        }


        /* =========================================================
           STATS
        ========================================================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 6px;

            margin-bottom: 20px;
        }

        .stat-card {
            min-height: 88px;

            padding: 11px 9px;

            background: #fff;

            border: 1px solid #cbd1de;

            border-radius: 8px;
        }

        .stat-label {
            color: #555d6b;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .3px;
        }

        .stat-label-danger {
            color: var(--danger);
        }

        .stat-value {
            margin-top: 8px;

            color: #262a33;

            font-size: 19px;
            font-weight: 700;
        }

        .stat-meta {
            margin-top: 4px;

            color: #626a79;

            font-size: 11px;
        }


        /* =========================================================
           TABS
        ========================================================= */

        .supplier-tabs {
            display: flex;

            gap: 25px;

            overflow-x: auto;

            border-bottom: 1px solid #c9cfdb;

            margin-bottom: 24px;

            scrollbar-width: none;
        }

        .supplier-tabs::-webkit-scrollbar {
            display: none;
        }

        .supplier-tab {
            position: relative;

            flex-shrink: 0;

            padding: 0 0 11px;

            border: 0;

            background: transparent;

            color: #505766;

            font-size: 12px;
            font-weight: 600;
        }

        .supplier-tab.active {
            color: #0b3ca5;
        }

        .supplier-tab.active::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: -1px;

            height: 2px;

            background: var(--primary);
        }


        /* =========================================================
           OVERVIEW CARDS
        ========================================================= */

        .overview-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 24px;
        }

        .content-card {
            background: #fff;

            border: 1px solid var(--border);

            border-radius: 9px;

            overflow: hidden;
        }

        .content-card-header {
            padding: 23px 24px;

            display: flex;
            align-items: center;

            gap: 10px;

            font-size: 19px;
            font-weight: 700;
        }

        .content-card-header i {
            color: var(--primary);

            font-size: 20px;
        }

        .content-card-body {
            padding: 0 24px 24px;
        }


        /* DELIVERY */

        .performance-top {
            display: flex;
            align-items: center;

            gap: 19px;

            margin-bottom: 20px;
        }

        .rate {
            position: relative;

            width: 58px;
            height: 58px;

            flex-shrink: 0;
        }

        .rate svg {
            width: 58px;
            height: 58px;

            transform: rotate(-90deg);
        }

        .rate circle {
            fill: none;

            stroke-width: 5;
        }

        .rate-bg {
            stroke: #e7eaf1;
        }

        .rate-value-circle {
            stroke: var(--primary);

            stroke-dasharray: 151;
            stroke-dashoffset: 23;
        }

        .rate-number {
            position: absolute;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--primary);

            font-size: 13px;
            font-weight: 800;
        }

        .performance-title {
            font-size: 16px;
            font-weight: 700;
        }

        .performance-subtitle {
            margin-top: 3px;

            color: #5b6372;

            font-size: 11px;
            font-weight: 600;
        }

        .performance-row {
            display: grid;

            grid-template-columns: 10px 1fr auto;

            align-items: center;

            gap: 8px;

            margin-bottom: 16px;

            color: #555d6b;

            font-size: 14px;
        }

        .dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;
        }

        .dot-blue {
            background: #163fae;
        }

        .dot-red {
            background: #c92323;
        }

        .dot-orange {
            background: #ed9c00;
        }

        .performance-number {
            color: #252932;

            font-weight: 700;
        }


        /* ATTENTION */

        .attention-card .content-card-header i {
            color: var(--danger);
        }

        .attention-item {
            padding: 13px;

            margin-bottom: 7px;

            border: 1px solid #ffc9c3;

            border-radius: 7px;

            background: var(--danger-bg);
        }

        .attention-item.warning {
            border-color: #ffe0a0;

            background: var(--warning-bg);
        }

        .attention-title {
            display: flex;
            align-items: center;

            gap: 8px;

            color: var(--danger);

            font-size: 14px;
            font-weight: 700;

            margin-bottom: 6px;
        }

        .attention-item.warning .attention-title {
            color: var(--warning);
        }

        .attention-text {
            padding-left: 24px;

            color: #525966;

            font-size: 12px;

            line-height: 1.5;

            font-weight: 600;
        }


        /* =========================================================
           INNER TAB PAGES
        ========================================================= */

        .inner-page {
            background: #fff;

            border: 1px solid var(--border);

            border-radius: 9px;

            padding: 25px;
        }

        .inner-page-title {
            margin-bottom: 6px;

            font-size: 21px;
            font-weight: 700;
        }

        .inner-page-text {
            color: var(--muted);

            font-size: 14px;
        }


        /* =========================================================
           MOBILE OVERLAY
        ========================================================= */

        .mobile-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, .4);

            z-index: 1040;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1200px) {

            :root {
                --sidebar-width: 245px;
            }

            .profile-layout {
                grid-template-columns: 280px minmax(0, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }


        @media (max-width: 1000px) {

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .mobile-menu {
                display: block;
            }

            .mobile-overlay.show {
                display: block;
            }

            .profile-layout {
                grid-template-columns: 1fr;
            }

            .profile-info {
                display: grid;

                grid-template-columns: repeat(2, 1fr);

                gap: 10px 25px;
            }
        }


        @media (max-width: 800px) {

            .overview-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons .btn {
                flex: 1;
            }
        }


        @media (max-width: 650px) {

            .topbar {
                padding: 0 15px;
            }

            .page {
                padding: 0 15px 35px;
            }

            .top-icon {
                display: none;
            }

            .top-btn-outline {
                display: none;
            }

            .search-box {
                width: 100%;
            }

            .list-toolbar {
                align-items: stretch;

                flex-direction: column;
            }

            .list-search {
                width: 100%;
            }

            .supplier-table {
                min-width: 750px;
            }

            .supplier-list-card {
                overflow-x: auto;
            }

            .profile-info {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 500px) {

            .page-title {
                font-size: 26px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .header-buttons {
                flex-direction: column;
            }

            .header-buttons .btn {
                width: 100%;
            }

            .content-card-header {
                padding: 20px;
            }

            .content-card-body {
                padding: 0 20px 20px;
            }

            .inner-page {
                padding: 20px;
            }
        }
    </style>
</head>


<body>


    <!-- =========================================================
         SIDEBAR
    ========================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-logo">
                H
            </div>

            <div>
                <div class="brand-title">
                    HBOS
                </div>

                <div class="brand-subtitle">
                    EXECUTIVE RETAIL
                </div>
            </div>

        </div>


        <nav class="sidebar-nav">

            <!-- ONLY SUPPLIERS -->

            <a href="#" class="nav-link-custom active" onclick="showSupplierList(); return false;">
                <i class="bi bi-truck"></i>

                <span>
                    Suppliers
                </span>
            </a>

        </nav>


        <div class="sidebar-footer">

            <a href="#" class="nav-link-custom" onclick="return false;">
                <i class="bi bi-gear"></i>

                <span>
                    Settings
                </span>
            </a>

        </div>

    </aside>


    <!-- MOBILE OVERLAY -->

    <div class="mobile-overlay" id="mobileOverlay" onclick="closeSidebar()"></div>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="topbar-left">

                <button class="mobile-menu" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>


                <div class="search-box">

                    <i class="bi bi-search"></i>

                    <input type="text" id="globalSearch" placeholder="Search...">

                </div>

            </div>


            <div class="top-actions">

                <button class="top-icon">
                    <i class="bi bi-bell"></i>
                </button>

                <button class="top-icon">
                    <i class="bi bi-question-circle"></i>
                </button>

                <button class="top-btn top-btn-outline">
                    Export
                </button>

                <button class="top-btn top-btn-primary" onclick="showAddSupplier()">
                    Create New
                </button>

            </div>

        </header>


        <!-- =====================================================
             PAGE CONTENT
        ====================================================== -->

        <div class="page" id="pageContent"></div>

    </main>


    <!-- =========================================================
         BOOTSTRAP JS
    ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script>

        /* =====================================================
           SUPPLIER DATA

        const suppliers = [

            {

            {

        ];


        let currentSupplier = suppliers[0];


        /* =====================================================
           SIDEBAR
        ===================================================== */

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

            document
                .getElementById("mobileOverlay")
                .classList.toggle("show");

        }


        function closeSidebar() {

            document
                .getElementById("sidebar")
                .classList.remove("open");

            document
                .getElementById("mobileOverlay")
                .classList.remove("show");

        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        function pageHeader(
            title,
            subtitle = "",
            buttons = ""
        ) {

            return `

                <div class="breadcrumb-area">

                    <span>Suppliers</span>

                    <i class="bi bi-chevron-right"></i>

                    <span class="current">
                        ${title}
                    </span>

                </div>


                <div class="page-header">

                    <div>

                        <h1 class="page-title">
                            ${title}
                        </h1>

                        ${subtitle
                    ? `
                                <div class="page-subtitle">
                                    ${subtitle}
                                </div>
                            `
                    : ""
                }

                    </div>


                    <div class="header-buttons">
                        ${buttons}
                    </div>

                </div>

            `;

        }


        /* =====================================================
           SUPPLIER LIST
        ===================================================== */

        function showSupplierList() {

            closeSidebar();

            document
                .getElementById("globalSearch")
                .value = "";

            document.getElementById("pageContent").innerHTML = `

                ${pageHeader(
                "Suppliers",
                "Manage your suppliers and supplier relationships.",
                `
                        <button
                            class="btn top-btn-outline"
                            onclick="showAddSupplier()"
                        >
                            <i class="bi bi-plus-lg me-1"></i>
                            Add Supplier
                        </button>
                    `
            )}


                <div class="supplier-list-card">


                    <div class="list-toolbar">

                        <div class="fw-semibold">
                            All Suppliers
                        </div>


                        <div class="list-search">

                            <i class="bi bi-search text-secondary"></i>

                            <input
                                type="text"
                                id="supplierSearch"
                                placeholder="Search supplier..."
                                oninput="filterSuppliers()"
                            >

                        </div>

                    </div>


                    <div class="table-responsive">

                        <table class="table supplier-table">

                            <thead>

                                <tr>

                                    <th>
                                        Supplier
                                    </th>

                                    <th>
                                        Phone
                                    </th>

                                    <th>
                                        Total Purchases
                                    </th>

                                    <th>
                                        Outstanding
                                    </th>

                                    <th>
                                        Products
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        Action
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="supplierTableBody">

                                ${supplierRows(suppliers)}

                            </tbody>

                        </table>

                    </div>

                </div>

            `;

        }


        /* =====================================================
           SUPPLIER ROWS
        ===================================================== */

        function supplierRows(data) {

            if (!data.length) {

                return `

                    <tr>

                        <td
                            colspan="7"
                            class="text-center py-5 text-secondary"
                        >
                            No suppliers found.
                        </td>

                    </tr>

                `;

            }


            return data.map((supplier, index) => `

                <tr>

                    <td>

                        <div class="supplier-name-cell">

                            <div class="supplier-avatar">
                                ${supplier.name.charAt(0)}
                            </div>

                            <div>

                                <div class="supplier-main-name">
                                    ${supplier.name}
                                </div>

                                <div class="supplier-id">
                                    ${supplier.id}
                                </div>

                            </div>

                        </div>

                    </td>


                    <td>
                        ${supplier.phone}
                    </td>


                    <td class="amount">
                        ${supplier.purchases}
                    </td>


                    <td
                        class="
                            amount
                            ${supplier.outstanding !== "PKR 0"
                    ? "amount-danger"
                    : ""
                }
                        "
                    >
                        ${supplier.outstanding}
                    </td>


                    <td>
                        ${supplier.products}
                    </td>


                    <td>

                        <span class="badge-active">
                            ${supplier.status}
                        </span>

                    </td>


                    <td>

                        <button
                            class="view-btn"
                            onclick="openSupplier(${index})"
                        >
                            View Profile
                        </button>

                    </td>

                </tr>

            `).join("");

        }


        /* =====================================================
           FILTER SUPPLIERS
        ===================================================== */

        function filterSuppliers() {

            const search =
                document
                    .getElementById("supplierSearch")
                    .value
                    .toLowerCase()
                    .trim();


            const filtered =
                suppliers.filter(supplier =>

                    supplier.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    supplier.id
                        .toLowerCase()
                        .includes(search)

                    ||

                    supplier.phone
                        .toLowerCase()
                        .includes(search)

                );


            document
                .getElementById("supplierTableBody")
                .innerHTML =
                supplierRows(filtered);

        }


        /* =====================================================
           OPEN SUPPLIER
        ===================================================== */

        function openSupplier(index) {

            currentSupplier = suppliers[index];

            showSupplierProfile();

        }


        /* =====================================================
           SUPPLIER PROFILE
        ===================================================== */

        function showSupplierProfile() {

            const s = currentSupplier;

            document.getElementById("pageContent").innerHTML = `

                <div class="breadcrumb-area">

                    <span>Suppliers</span>

                    <i class="bi bi-chevron-right"></i>

                    <span class="current">
                        ${s.name}
                    </span>

                </div>


                <div class="page-header">

                    <div>

                        <h1 class="page-title">
                            Supplier Profile: ${s.name}
                        </h1>

                    </div>


                    <div class="header-buttons">

                        <button
                            class="btn top-btn-outline"
                        >
                            Edit Supplier
                        </button>

                        <button
                            class="btn top-btn-outline"
                            onclick="showSupplierPurchases()"
                        >
                            View Purchases
                        </button>

                        <button
                            class="btn top-btn-primary"
                        >
                            Record Payment
                        </button>

                    </div>

                </div>


                <div class="profile-layout">


                    <!-- LEFT PROFILE -->

                    <div class="profile-card">

                        <div class="profile-title-row">

                            <div class="supplier-large-icon">
                                <i class="bi bi-truck"></i>
                            </div>

                            <div class="profile-name">
                                ${s.name}
                            </div>

                        </div>


                        <div class="status-badge">
                            ${s.status}
                        </div>


                        <div class="profile-info">


                            <div class="profile-field">

                                <div class="field-label">

                                </div>

                                <div class="field-value">
                                    ${s.id}
                                </div>

                            </div>


                            <div class="profile-field">

                                <div class="field-label">
                                    Phone
                                </div>

                                <div class="field-value">
                                    ${s.phone}
                                </div>

                            </div>


                            <div class="profile-field">

                                <div class="field-label">
                                    Email
                                </div>

                                <div class="field-value">
                                    ${s.email}
                                </div>

                            </div>


                            <div class="profile-field">

                                <div class="field-label">
                                    Address
                                </div>

                                <div class="field-value">
                                    ${s.address}
                                </div>

                            </div>


                        </div>

                    </div>


                    <!-- RIGHT -->

                    <div>


                        <!-- STATS -->

                        <div class="stats-grid">


                            <div class="stat-card">

                                <div class="stat-label">
                                    Total Purchases
                                </div>

                                <div class="stat-value">
                                    ${s.purchases}
                                </div>

                            </div>


                            <div class="stat-card">

                                <div class="stat-label stat-label-danger">
                                    <i class="bi bi-exclamation-circle"></i>
                                    Outstanding
                                </div>

                                <div class="stat-value">
                                    ${s.outstanding}
                                </div>

                            </div>


                            <div class="stat-card">

                                <div class="stat-label">
                                    Products Supplied
                                </div>

                                <div class="stat-value">
                                    ${s.products}
                                </div>

                            </div>


                            <div class="stat-card">

                                <div class="stat-label">
                                    Avg Purchase
                                </div>

                                <div class="stat-value">
                                    ${s.average}
                                </div>

                                <div class="stat-meta">
                                    Last: ${s.lastPurchase}
                                </div>

                            </div>


                        </div>


                        <!-- TABS -->

                        <div class="supplier-tabs">

                            <button
                                class="supplier-tab active"
                                id="tab-overview"
                                onclick="showSupplierOverview()"
                            >
                                Overview
                            </button>

                            <button
                                class="supplier-tab"
                                id="tab-purchases"
                                onclick="showSupplierPurchases()"
                            >
                                Purchases
                            </button>

                            <button
                                class="supplier-tab"
                                id="tab-products"
                                onclick="showSupplierProducts()"
                            >
                                Products
                            </button>

                            <button
                                class="supplier-tab"
                                id="tab-performance"
                                onclick="showSupplierPerformance()"
                            >
                                Performance
                            </button>

                        </div>


                        <div id="supplierTabContent"></div>


                    </div>

                </div>

            `;


            showSupplierOverview();

        }


        /* =====================================================
           SET ACTIVE TAB
        ===================================================== */

        function setSupplierTab(id) {

            document
                .querySelectorAll(".supplier-tab")
                .forEach(tab => {
                    tab.classList.remove("active");
                });

            document
                .getElementById(id)
                .classList.add("active");

        }


        /* =====================================================
           OVERVIEW
        ===================================================== */

        function showSupplierOverview() {

            setSupplierTab("tab-overview");

            document
                .getElementById("supplierTabContent")
                .innerHTML = `

                    <div class="overview-grid">


                        <!-- DELIVERY PERFORMANCE -->

                        <div class="content-card">

                            <div class="content-card-header">

                                <i class="bi bi-graph-up"></i>

                                Delivery Performance

                            </div>


                            <div class="content-card-body">


                                <div class="performance-top">


                                    <div class="rate">

                                        <svg viewBox="0 0 60 60">

                                            <circle
                                                class="rate-bg"
                                                cx="30"
                                                cy="30"
                                                r="24"
                                            ></circle>

                                            <circle
                                                class="rate-value-circle"
                                                cx="30"

                                                r="24"
                                            ></circle>

                                        <div class="rate-number">
                                            85%
                                        </div>

                                    </div>


                                    <div>

                                        <div class="performance-title">
                                            On-Time Rate
                                        </div>

                                        <div class="performance-subtitle">
                                            Based on 40 recent orders
                                        </div>

                                </div>


                                <div class="performance-row">

                                    <span class="dot dot-blue"></span>

                                    <span>
                                        On-Time
                                    </span>

                                    <span class="performance-number">
                                        34
                                    </span>

                                </div>


                                <div class="performance-row">

                                    <span class="dot dot-red"></span>

                                        Late
                                    </span>

                                    <span class="performance-number">
                                        4
                                    </span>

                                </div>


                                <div class="performance-row">

                                    <span class="dot dot-orange"></span>

                                    <span>
                                        Pending
                                    </span>

                                    <span class="performance-number">
                                        2
                                    </span>

                                </div>

                            </div>

                        </div>


                        <!-- ATTENTION -->

                        <div class="content-card attention-card">

                            <div class="content-card-header">

                                <i class="bi bi-exclamation-triangle"></i>

                                Needs Attention

                            </div>


                            <div class="content-card-body">


                                <div class="attention-item">

                                    <div class="attention-title">

                                        <i class="bi bi-cash-stack"></i>

                                        Payment Overdue

                                    <div class="attention-text">

                                        Invoice INV-882 is 4 days past due.
                                        Amount: PKR 32,000.

                                    </div>

                                </div>


                                <div class="attention-item warning">

                                    <div class="attention-title">

                                        <i class="bi bi-graph-up-arrow"></i>

                                        Purchase Price Increased

                                    </div>

                                    <div class="attention-text">

                                        SKU-A99 (Premium Flour) price increased
                                        by 5% on last PO.

                                    </div>

                                </div>


                            </div>

                        </div>


                    </div>

                `;

        }


        /* =====================================================
           PURCHASES PAGE
        ===================================================== */

        function showSupplierPurchases() {

            setSupplierTab("tab-purchases");

            document
                .getElementById("supplierTabContent")
                .innerHTML = `

                    <div class="inner-page">

                        <h2 class="inner-page-title">
                            Supplier Purchases
                        </h2>

                        <p class="inner-page-text">
                            All purchase orders, invoices and purchase
                            history for ${currentSupplier.name}
                            will appear here.
                        </p>

                    </div>

                `;

        }


        /* =====================================================
           PRODUCTS PAGE
        ===================================================== */

        function showSupplierProducts() {

            setSupplierTab("tab-products");

            document
                .getElementById("supplierTabContent")
                .innerHTML = `

                    <div class="inner-page">

                        <h2 class="inner-page-title">
                            Products Supplied
                        </h2>

                        <p class="inner-page-text">
                            Products supplied by ${currentSupplier.name}
                            will appear here.
                        </p>

                    </div>

                `;

        }


        /* =====================================================
           PERFORMANCE PAGE
        ===================================================== */

        function showSupplierPerformance() {

            setSupplierTab("tab-performance");

            document
                .getElementById("supplierTabContent")
                .innerHTML = `

                    <div class="inner-page">

                        <h2 class="inner-page-title">
                            Supplier Performance
                        </h2>

                        <p class="inner-page-text">
                            Delivery performance, late orders,
                            purchase trends and supplier performance
                            metrics will appear here.
                        </p>

                    </div>

                `;

        }


        /* =====================================================
           ADD SUPPLIER
        ===================================================== */

        function showAddSupplier() {

            document.getElementById("pageContent").innerHTML = `

                ${pageHeader(
                "Add Supplier",
                "Create a new supplier record."
            )}


                <div class="inner-page">

                    <form
                        onsubmit="saveSupplier(event)"
                    >

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Supplier Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="newSupplierName"
                                    placeholder="Enter supplier name"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Phone
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="+92..."
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="supplier@email.com"
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Supplier ID
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="SUP-XXXX"
                                >

                            </div>


                            <div class="col-12">

                                <label class="form-label fw-semibold">
                                    Address
                                </label>

                                <textarea
                                    class="form-control"
                                    rows="3"
                                    placeholder="Supplier address"
                                ></textarea>

                            </div>


                            <div class="col-12">

                                <button
                                    type="submit"
                                    class="btn top-btn-primary"
                                >
                                    Save Supplier
                                </button>

                                <button
                                    type="button"
                                    class="btn top-btn-outline ms-2"
                                    onclick="showSupplierList()"
                                >
                                    Cancel
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            `;

        }


        /* =====================================================
           SAVE SUPPLIER
        ===================================================== */

        function saveSupplier(event) {

            event.preventDefault();

            const name =
                document
                    .getElementById("newSupplierName")
                    .value
                    .trim();

            if (!name) {
                return;
            }

            suppliers.push({

                id:
                    "SUP-" +
                    Math.floor(
                        1000 +
                        Math.random() * 8999
                    ),

                name: name,

                phone: "+92 300 0000000",

                email: "supplier@example.com",

                address: "Supplier address",

                purchases: "PKR 0",

                outstanding: "PKR 0",

                products: 0,

                average: "PKR 0",

                lastPurchase: "-",

                status: "Active"

            });


            showSupplierList();

        }


        /* =====================================================
           INITIAL PAGE
        ===================================================== */

        showSupplierList();

    </script>

</body>

</html>
